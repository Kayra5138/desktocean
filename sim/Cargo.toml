[package]
name = "desktocean-sim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Aquarium simulation core for Desktocean"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Must stay "unwind": the FFI layer catches panics so a bug cannot take plasmashell down.
panic = "unwind"
